services:
  - type: web
    name: vitrine-celulares
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: STORAGE_DRIVER
        value: database
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
